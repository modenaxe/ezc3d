name: WASM Build

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  build-wasm:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Emscripten
      uses: mymindstorm/setup-emsdk@v12
      with:
        version: 'latest'

    - name: Configure CMake for WASM
      run: |
        emcmake cmake -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -DBUILD_SHARED_LIBS=OFF \
          -DBUILD_EXAMPLE=OFF \
          -DBUILD_TESTS=OFF \
          -DCMAKE_EXE_LINKER_FLAGS="--bind -s FORCE_FILESYSTEM=1 -s EXPORTED_RUNTIME_METHODS=['FS'] -s MODULARIZE=1 -s EXPORT_NAME='ezc3d' -s ALLOW_MEMORY_GROWTH=1"
          
    - name: Build
      run: emmake make -C build

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ezc3d-wasm-web
        path: |
          build/ezc3d.js
          build/ezc3d.wasm
