name: WASM Build and Deploy

on:
  push:
    branches: [ main, dev ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Emscripten
      uses: mymindstorm/setup-emsdk@v12
      with:
        version: '3.1.51'

    - name: Configure CMake
      # INCLUDES:
      # 1. _malloc/_free exposed (fixes "module._malloc is not a function")
      # 2. FORCE_FILESYSTEM (fixes file reading)
      # 3. MODULARIZE (wraps code)
      run: |
        emcmake cmake -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -DBUILD_SHARED_LIBS=OFF \
          -DBUILD_EXAMPLE=OFF \
          -DBUILD_TESTS=OFF \
          -DCMAKE_CXX_FLAGS="-std=c++17" \
          -DCMAKE_EXE_LINKER_FLAGS="--bind -s FORCE_FILESYSTEM=1 -s EXPORTED_RUNTIME_METHODS=['FS','getExceptionMessage'] -s EXPORTED_FUNCTIONS=['_malloc','_free'] -s MODULARIZE=1 -s EXPORT_NAME='ezc3d' -s ALLOW_MEMORY_GROWTH=1 \
            -s ASSERTIONS=1 \
            -s DISABLE_EXCEPTION_CATCHING=0"
            
    - name: Build WASM
      run: emmake make -C build

    - name: Patch JS for ES6
      run: echo "export default ezc3d;" >> build/ezc3d.js

    - name: Prepare Files for Deployment
      run: |
        mkdir public
        cp build/ezc3d.js public/
        cp build/ezc3d.wasm public/
        echo '<html><body><h1>EZC3D WASM Host</h1><script type="module">import ezc3d from "./ezc3d.js"; ezc3d().then(m=>{console.log("Module Loaded:",m); document.body.append("Success: Module Loaded!");});</script></body></html>' > public/index.html

    - name: Setup GitHub Pages
      uses: actions/configure-pages@v4

    - name: Upload Artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: 'public'

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
